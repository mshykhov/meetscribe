[project]
name = "meetscribe"
version = "0.4.0"
description = "Automated meeting video transcription, diarization, and summarization pipeline"
requires-python = ">=3.10,<3.14"
dependencies = [
    "whisperx-mlx[mlx] @ git+https://github.com/sooth/whisperx-mlx.git",
    "python-dotenv",
    "openai>=1.0",
    "typer>=0.12",
    "watchdog>=4.0",
]

[project.scripts]
meetscribe = "src.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = false
